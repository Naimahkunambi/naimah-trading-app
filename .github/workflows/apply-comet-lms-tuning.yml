name: Apply Comet and Last Man tuning controls

on:
  push:
    branches: ['codex/comet-lms-demo-multipliers']
    paths:
      - '.github/workflows/apply-comet-lms-tuning.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: codex/comet-lms-demo-multipliers

      - name: Apply editable tuning controls
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/apply_tuning.py
          python3 /tmp/apply_tuning.py

      - name: Syntax check
        run: npm run check

      - name: Test
        run: npm test

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name "SANI Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/apply-comet-lms-tuning.yml
          git add public/comet.js public/comet.html public/comet.css public/last-man-standing.js public/last-man-standing.html public/last-man-standing.css public/core/demo-multiplier-executor.mjs tests/demo-multiplier-executor.test.mjs
          git commit -m "feat: editable Comet and Last Man tuning controls [skip ci]"
          git push origin HEAD:codex/comet-lms-demo-multipliers
