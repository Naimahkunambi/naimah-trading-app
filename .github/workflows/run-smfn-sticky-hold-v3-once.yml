name: Run SMFN Sticky Hold V3 Once

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/run-smfn-sticky-hold-v3-once.yml

permissions:
  contents: write

jobs:
  patch-build-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/smfn-sticky-hold-v3
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Apply Sticky Hold V3
        run: python3 tools/patch_smfn_sticky_hold_v3.py

      - name: Compile cTrader bot
        run: dotnet build ctrader/NAI-MOUNTAIN-STORY-ENGINE-V2/NAI-MOUNTAIN-STORY-ENGINE-V2.csproj --configuration Release

      - name: Commit validated strategy
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ctrader/NAI-MOUNTAIN-STORY-ENGINE-V2/NAI-MOUNTAIN-STORY-ENGINE-V2.cs
          git commit -m "feat: SMFN sticky HOLD and structural exit V3"
          git push origin HEAD:codex/smfn-sticky-hold-v3
