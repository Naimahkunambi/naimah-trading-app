            bool protectedBroken;
            double buffer = Math.Max(CurrentSpread() * 0.18, _noiseEma * 1.5);
            if (tradeDirection == Direction.Up)
                protectedBroken = _active.ProtectedPrice > 0 && mid < _active.ProtectedPrice - buffer;
            else
                protectedBroken = _active.ProtectedPrice > 0 && mid > _active.ProtectedPrice + buffer;

