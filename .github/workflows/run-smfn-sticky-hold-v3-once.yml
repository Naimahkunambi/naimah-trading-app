            double fast = _ticks.Delta(4);
            double medium = _ticks.Delta(12);
            double accel = _ticks.Acceleration(3, 10);
            double noise = Math.Max(_noiseEma, Symbol.TickSize * 5);

            if (direction == Direction.Up)
            {
                return aligned >= 2 &&
                       fast > noise * 0.45 &&
                       medium > -_microThreshold * 0.35 &&
                       accel > -noise * 0.15;
            }

            return aligned >= 2 &&
                   fast < -noise * 0.45 &&
                   medium < _microThreshold * 0.35 &&
                   accel < noise * 0.15;
        }
