name: Run SMFN Sticky Hold V3 Once

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/run-smfn-sticky-hold-v3-once.yml

permissions:
  contents: write

jobs:
  patch-build-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/smfn-sticky-hold-v3
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Apply sticky HOLD patch
        shell: bash
        run: |
          python3 - <<'PY'
