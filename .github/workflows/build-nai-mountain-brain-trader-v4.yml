name: Build NAI Mountain Brain Trader V4

on:
  push:
    paths:
      - 'ctrader/NAI-MOUNTAIN-BRAIN-TRADER-V4/**'
      - '.github/workflows/build-nai-mountain-brain-trader-v4.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore ctrader/NAI-MOUNTAIN-BRAIN-TRADER-V4/NAI-MOUNTAIN-BRAIN-TRADER-V4.csproj

      - name: Build
        run: dotnet build ctrader/NAI-MOUNTAIN-BRAIN-TRADER-V4/NAI-MOUNTAIN-BRAIN-TRADER-V4.csproj -c Release --no-restore

      - name: Locate algo
        run: |
          set -e
          find ctrader/NAI-MOUNTAIN-BRAIN-TRADER-V4 -type f -name '*.algo' -print
          ALGO=$(find ctrader/NAI-MOUNTAIN-BRAIN-TRADER-V4 -type f -name '*.algo' | head -n 1)
          test -n "$ALGO"
          cp "$ALGO" NAI-MOUNTAIN-BRAIN-TRADER-V4.algo

      - name: Upload V4 algo
        uses: actions/upload-artifact@v4
        with:
          name: NAI-MOUNTAIN-BRAIN-TRADER-V4
          path: NAI-MOUNTAIN-BRAIN-TRADER-V4.algo
