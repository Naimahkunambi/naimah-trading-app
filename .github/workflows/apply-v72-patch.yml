name: Apply v7.2 data-led patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v72-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v7.2 patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/pattern-trader.js')
          s = p.read_text()

          def rep(old, new):
              global s
              if old not in s:
                  print('WARN missing:', old[:90])
                  return
              s = s.replace(old, new)

          rep("const VERSION = 'v7.1';", "const VERSION = 'v7.2';")
          rep("const LEDGER_KEY = 'sani.masterTrader.signalLedger.v7.1';", "const LEDGER_KEY = 'sani.masterTrader.signalLedger.v7.2';\nconst LEGACY_LEDGER_KEY = 'sani.masterTrader.signalLedger.v7.1';")
          rep("const MAX_BREAK_EXTENSION_STEPS = 1.10;", "const MAX_BREAK_EXTENSION_STEPS = 1.10;\nconst FIXED_DURATION = 10;")
          rep("let ledger = loadArray(LEDGER_KEY);", "let ledger = loadArray(LEDGER_KEY);\nconst legacyLedger = loadArray(LEGACY_LEDGER_KEY);")
          rep("  duration: 3,", "  duration: FIXED_DURATION,")
          rep("engine.onTick = function v71Tick(tick) {", "engine.onTick = function v72Tick(tick) {")

          old = """  let direction = authority80;
  if (direction === 'NEUTRAL' && fast20 !== 'NEUTRAL' && regime200 !== (fast20 === 'BULL' ? 'BEAR' : 'BULL')) direction = fast20;
  if (direction !== 'NEUTRAL' && regime200 !== 'NEUTRAL' && regime200 !== direction && Math.abs(m200.slopeNorm) >= .11) direction = 'NEUTRAL';"""
          new = """  // v7.2 strict hierarchy: FAST can never override macro/authority.
  // A trade direction exists only when 200t and 80t are both non-neutral and agree.
  const direction = regime200 !== 'NEUTRAL' && regime200 === authority80 ? regime200 : 'NEUTRAL';"""
          rep(old, new)

          rep("""    const timingClass = event
      ? (breakDistanceSteps <= MAX_BREAK_EXTENSION_STEPS ? 'PRIME' : 'CHASE')
      : aboveBefore ? 'CHASE'
        : early ? 'EARLY' : 'WAIT';
    const ready = event && timingClass === 'PRIME';""",
              """    const timingClass = event
      ? (breakDistanceSteps <= MAX_BREAK_EXTENSION_STEPS ? 'PRIME' : 'EXTENDED')
      : aboveBefore ? 'POST_BREAK'
        : early ? 'EARLY' : 'WAIT';
    const ready = event;""")
          rep("type: ready ? 'HL_BOS_FIRST_BREAK' : event ? 'HL_BOS_CHASE' : early ? 'HL_ARMED' : 'WAIT_BOS',",
              "type: ready ? 'HL_BOS_FIRST_BREAK' : early ? 'HL_ARMED' : 'WAIT_BOS',")
          rep(": ready ? `HL → BOS first break · PRIME ${breakDistanceSteps.toFixed(2)}x`\n          : event ? `HL → BOS but CHASE ${breakDistanceSteps.toFixed(2)}x`",
              ": ready ? `HL → BOS first break · ${timingClass} ${breakDistanceSteps.toFixed(2)}x`")

          rep("""  const timingClass = event
    ? (breakDistanceSteps <= MAX_BREAK_EXTENSION_STEPS ? 'PRIME' : 'CHASE')
    : belowBefore ? 'CHASE'
      : early ? 'EARLY' : 'WAIT';
  const ready = event && timingClass === 'PRIME';""",
              """  const timingClass = event
    ? (breakDistanceSteps <= MAX_BREAK_EXTENSION_STEPS ? 'PRIME' : 'EXTENDED')
    : belowBefore ? 'POST_BREAK'
      : early ? 'EARLY' : 'WAIT';
  const ready = event;""")
          rep("type: ready ? 'LH_BOS_FIRST_BREAK' : event ? 'LH_BOS_CHASE' : early ? 'LH_ARMED' : 'WAIT_BOS',",
              "type: ready ? 'LH_BOS_FIRST_BREAK' : early ? 'LH_ARMED' : 'WAIT_BOS',")
          rep(": ready ? `LH → BOS first break · PRIME ${breakDistanceSteps.toFixed(2)}x`\n        : event ? `LH → BOS but CHASE ${breakDistanceSteps.toFixed(2)}x`",
              ": ready ? `LH → BOS first break · ${timingClass} ${breakDistanceSteps.toFixed(2)}x`")

          rep(".filter(h => [3, 5, 8, 10].includes(Number(h.horizon)) && Number(h.decided || 0) >= MIN_MATCHES && ['UP', 'DOWN'].includes(h.bias))",
              ".filter(h => Number(h.horizon) === FIXED_DURATION && Number(h.decided || 0) >= MIN_MATCHES && ['UP', 'DOWN'].includes(h.bias))")
          s = s.replace("duration: bestAgree.horizon,", "duration: FIXED_DURATION,")
          s = s.replace("duration: strongest?.horizon || 3,", "duration: FIXED_DURATION,")
          s = s.replace("duration: pattern.duration || 3,", "duration: FIXED_DURATION,")
          s = s.replace("const duration = Number(d.pattern?.duration || 3);", "const duration = FIXED_DURATION;")
          s = s.replace("const duration = Number(trade.duration || trade.patternMeta.duration || 3);", "const duration = Number(trade.duration || trade.patternMeta.duration || FIXED_DURATION);")

          rep("const timingBlocked = d.setup?.timingClass === 'CHASE' || !d.setup?.ready;", "const timingBlocked = !d.setup?.ready;")
          rep("status: timingBlocked ? 'BLOCK TIMING CHASE' : agreement ? 'AGREEMENT' : `BLOCK PATTERN ${d.pattern.status}`,","
              "status: timingBlocked ? 'BLOCK STRUCTURE' : agreement ? 'AGREEMENT' : `BLOCK PATTERN ${d.pattern.status}`,")
          rep("id: `v71-${d.epoch}-${Date.now()}`,", "id: `v72-${d.epoch}-${Date.now()}`,")
          rep("cohort: 'v7.1-hl-lh-bos-first-break',", "cohort: 'v7.2-strict-200-80-bos-pattern-10t',")

          rep("engine.config.duration = Number(d.pattern.duration);", "engine.config.duration = FIXED_DURATION;")
          rep("structure: `v71-${d.setup.pivotType.toLowerCase()}-bos-first-break-${d.pattern.duration}t`,",
              "structure: `v72-strict-${d.setup.pivotType.toLowerCase()}-bos-${d.setup.timingClass.toLowerCase()}-${FIXED_DURATION}t`,")

          rep("const visibleCandidates = ledger.filter(r => Number(r.signalEpoch) >= startEpoch && Number(r.signalEpoch) <= endEpoch);",
              "const visibleCandidates = [...legacyLedger, ...ledger].filter(r => Number(r.signalEpoch) >= startEpoch && Number(r.signalEpoch) <= endEpoch);")

          s = s.replace("Pattern + Structure Sniper v7.1", "Pattern + Structure Sniper v7.2")
          s = s.replace("v7.1", "v7.2")
          s = s.replace("PRIME BOS", "BOS")
          s = s.replace("WAITING FOR PRIME BOS", "WAITING FOR 200+80 + BOS")
          s = s.replace("Pattern audits PRIME BOS candidates only.", "Pattern audits BOS candidates only after strict 200+80 alignment.")
          s = s.replace("200 ticks are macro context. 80 ticks are the main direction authority. A strong conflicting 200-tick context can veto a weak 80-tick flip.", "200 ticks and 80 ticks must BOTH be BULL or BOTH be BEAR. NEUTRAL at either level means no trade. FAST 20 never overrides this gate.")
          s = s.replace("If that first break is already more than ${MAX_BREAK_EXTENSION_STEPS.toFixed(2)} average tick beyond the level, label CHASE and block it.", "Break distance is logged as PRIME or EXTENDED. v7.2 does not reject the first break only because it continued beyond ${MAX_BREAK_EXTENSION_STEPS.toFixed(2)} average tick.")
          s = s.replace("historical relatives must support the same direction with 40+ matches, 88%+ similarity and 55%+ execution-aware edge.", "historical relatives must support the same direction with 40+ matches, 88%+ similarity and 55%+ edge on the fixed 10T execution horizon.")
          s = s.replace("No v7.2 PRIME agreement trades yet.", "No v7.2 strict-alignment trades yet.")
          s = s.replace("master-v7.2-bos-timing-", "master-v7.2-strict-alignment-10t-")

          p.write_text(s)
          PY

      - name: Syntax check
        run: node --check public/pattern-trader.js

      - name: Commit v7.2
        shell: bash
        run: |
          git config user.name "SANI Patch Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/pattern-trader.js
          git commit -m "feat: v7.2 strict 200+80 alignment and fixed 10T [skip ci]"
          git push
