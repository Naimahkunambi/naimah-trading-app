name: Hotfix Macro Trend Gate

on:
  push:
    branches:
      - codex/comet-lms-demo-multipliers

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/comet-lms-demo-multipliers
          fetch-depth: 0

      - name: Patch strategy
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q '\[macro-trend-fixed\]'; then
            echo 'Macro trend patch already applied.'
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path

          macro = '''function macroTrend(rows = ticks) {
  const q = (rows || []).map(r => Number(r.quote)).filter(Number.isFinite);
  if (q.length < 90) return { direction: 'WARMING', strength: 0, votes: 0 };
  const averageTail = n => {
    const a = q.slice(-Math.min(n, q.length));
    return a.reduce((s, v) => s + v, 0) / Math.max(1, a.length);
  };
  const fast = averageTail(24), mid = averageTail(72), slow = averageTail(180), last = q.at(-1);
  const q60 = q[Math.max(0, q.length - 60)], q180 = q[Math.max(0, q.length - 180)];
  const upVotes = [fast > mid, mid > slow, last > mid, last > q60, last > q180].filter(Boolean).length;
  const direction = upVotes >= 4 ? 'UP' : upVotes <= 1 ? 'DOWN' : 'CHOP';
  const step = tickStep(rows) || 1;
  const displacement = Math.abs(last - q180) / step;
  const strength = Math.round(clamp((Math.abs(upVotes - 2.5) / 2.5) * 65 + Math.min(35, displacement * 1.5), 0, 100));
  return { direction, strength, votes: upVotes, fast, mid, slow, displacement };
}'''

          def replace_once(s, old, new, label):
              if old not in s:
                  raise SystemExit(f'{label} marker missing')
              return s.replace(old, new, 1)

          p = Path('public/comet.js')
          s = p.read_text()
          marker = "function allowedSide(m) {\n  return m?.allowedDirection === 'CALL' ? 'LONG' : m?.allowedDirection === 'PUT' ? 'SHORT' : 'NONE';\n}"
          if 'function macroTrend(rows = ticks)' not in s:
              s = replace_once(s, marker, macro + '\n' + marker, 'COMET macro insert')
          s = replace_once(s,
          """function candidate(m) {
  if (!auto || position || !m?.ready) return null;
  if (!['UP', 'DOWN'].includes(m.direction)) return null;
  const direction = m.direction === 'UP' ? 'CALL' : 'PUT';""",
          """function candidate(m) {
  if (!auto || position || !m?.ready) return null;
  if (!['UP', 'DOWN'].includes(m.direction)) return null;
  const macro = macroTrend(ticks);
  if (!['UP', 'DOWN'].includes(macro.direction) || macro.direction !== m.direction) return null;
  const direction = m.direction === 'UP' ? 'CALL' : 'PUT';""", 'COMET candidate')
          s = replace_once(s, '    entryContext: slimMountain(m), plannedRiskDistance: riskDistance', '    entryContext: slimMountain(m), macroContext: macro, plannedRiskDistance: riskDistance', 'COMET context')
          s = replace_once(s,
          """  const opposite = (position.side === 'LONG' && m.direction === 'DOWN') || (position.side === 'SHORT' && m.direction === 'UP');
  position.reversalVotes = opposite ? Number(position.reversalVotes || 0) + 1 : 0;
  if (position.reversalVotes >= cometReversalVotesNeeded()) return closePaperPosition('CONFIRMED MOUNTAIN REVERSAL', q);""",
          """  const macro = macroTrend(ticks);
  const opposite = (position.side === 'LONG' && m.direction === 'DOWN') || (position.side === 'SHORT' && m.direction === 'UP');
  const macroOpposite = (position.side === 'LONG' && macro.direction === 'DOWN') || (position.side === 'SHORT' && macro.direction === 'UP');
  position.reversalVotes = opposite && macroOpposite ? Number(position.reversalVotes || 0) + 1 : 0;
  if (position.reversalVotes >= cometReversalVotesNeeded()) return closePaperPosition('CONFIRMED MACRO + MOUNTAIN REVERSAL', q);""", 'COMET reversal')
          s = replace_once(s, "$('mapPermission').textContent = `${allowedSide(latestMountain)} ONLY`;", "$('mapPermission').textContent = `${allowedSide(latestMountain)} LOCAL · BIG ${macroTrend(ticks).direction}`;", 'COMET UI')
          s = replace_once(s, 'getMountain: () => structuredClone(latestMountain), getDemoExecution:', 'getMountain: () => structuredClone(latestMountain), getMacroTrend: () => structuredClone(macroTrend(ticks)), getDemoExecution:', 'COMET runtime')
          p.write_text(s)

          p = Path('public/last-man-standing.js')
          s = p.read_text()
          marker = "function allowedSide(m) { return m?.allowedDirection === 'CALL' ? 'LONG' : m?.allowedDirection === 'PUT' ? 'SHORT' : 'NONE'; }"
          if 'function macroTrend(rows = ticks)' not in s:
              s = replace_once(s, marker, macro + '\n' + marker, 'LMS macro insert')
          s = replace_once(s,
          """function candidate(m) {
  if (!auto || position || !m?.ready || !['UP', 'DOWN'].includes(m.direction)) return null;
  const direction = m.direction === 'UP' ? 'CALL' : 'PUT';""",
          """function candidate(m) {
  if (!auto || position || !m?.ready || !['UP', 'DOWN'].includes(m.direction)) return null;
  const macro = macroTrend(ticks);
  if (!['UP', 'DOWN'].includes(macro.direction) || macro.direction !== m.direction) return null;
  const direction = m.direction === 'UP' ? 'CALL' : 'PUT';""", 'LMS candidate')
          s = replace_once(s, 'entryContext: slimMountain(m), plannedRiskDistance: riskDistance', 'entryContext: slimMountain(m), macroContext: macro, plannedRiskDistance: riskDistance', 'LMS context')
          s = replace_once(s,
          """  const opposite = (p.side === 'LONG' && m.direction === 'DOWN') || (p.side === 'SHORT' && m.direction === 'UP');
  p.reversalVotes = opposite ? Number(p.reversalVotes || 0) + 1 : 0;
  if (p.reversalVotes >= lmsReversalVotesNeeded()) return closePaperPosition('CONFIRMED MOUNTAIN REVERSAL', q);""",
          """  const macro = macroTrend(ticks);
  const opposite = (p.side === 'LONG' && m.direction === 'DOWN') || (p.side === 'SHORT' && m.direction === 'UP');
  const macroOpposite = (p.side === 'LONG' && macro.direction === 'DOWN') || (p.side === 'SHORT' && macro.direction === 'UP');
  p.reversalVotes = opposite && macroOpposite ? Number(p.reversalVotes || 0) + 1 : 0;
  if (p.reversalVotes >= lmsReversalVotesNeeded()) return closePaperPosition('CONFIRMED MACRO + MOUNTAIN REVERSAL', q);""", 'LMS reversal')
          s = replace_once(s, "$('trendMountain').textContent = latestMountain.direction || 'WARMING'; $('trendPermission').textContent = `${allowedSide(latestMountain)} ONLY`;", "$('trendMountain').textContent = latestMountain.direction || 'WARMING'; $('trendPermission').textContent = `${allowedSide(latestMountain)} LOCAL · BIG ${macroTrend(ticks).direction}`;", 'LMS UI')
          s = replace_once(s, 'getMountain:()=>structuredClone(latestMountain),getTrendPower:', 'getMountain:()=>structuredClone(latestMountain),getMacroTrend:()=>structuredClone(macroTrend(ticks)),getTrendPower:', 'LMS runtime')
          p.write_text(s)
          PY
          node --check public/comet.js
          node --check public/last-man-standing.js

      - name: Commit strategy patch
        shell: bash
        run: |
          if git diff --quiet public/comet.js public/last-man-standing.js; then
            echo 'No strategy changes to commit.'
            exit 0
          fi
          git config user.name 'SANI Trend Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add public/comet.js public/last-man-standing.js
          git commit -m 'fix: macro trend boss for Comet and LMS [macro-trend-fixed]'
          git push origin HEAD:codex/comet-lms-demo-multipliers
