name: Hotfix Macro Trend Gate

on:
  push:
    branches:
      - codex/comet-lms-demo-multipliers

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[macro-trend-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/comet-lms-demo-multipliers
          fetch-depth: 0

      - name: Patch COMET and Last Man with macro trend boss
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          macro = r'''
function macroTrend(rows = ticks) {
  const q = (rows || []).map(r => Number(r.quote)).filter(Number.isFinite);
  if (q.length < 90) return { direction: 'WARMING', strength: 0, votes: 0 };
  const averageTail = n => {
    const a = q.slice(-Math.min(n, q.length));
    return a.reduce((s, v) => s + v, 0) / Math.max(1, a.length);
  };
  const fast = averageTail(24);
  const mid = averageTail(72);
  const slow = averageTail(180);
  const last = q.at(-1);
  const q60 = q[Math.max(0, q.length - 60)];
  const q180 = q[Math.max(0, q.length - 180)];
  const upVotes = [fast > mid, mid > slow, last > mid, last > q60, last > q180].filter(Boolean).length;
  const direction = upVotes >= 4 ? 'UP' : upVotes <= 1 ? 'DOWN' : 'CHOP';
  const step = tickStep(rows) || 1;
  const displacement = Math.abs(last - q180) / step;
  const strength = Math.round(clamp((Math.abs(upVotes - 2.5) / 2.5) * 65 + Math.min(35, displacement * 1.5), 0, 100));
  return { direction, strength, votes: upVotes, fast, mid, slow, displacement };
}
'''.strip()

          # COMET
          path = Path('public/comet.js')
          s = path.read_text()
          tick_marker = "function allowedSide(m) {\n  return m?.allowedDirection === 'CALL' ? 'LONG' : m?.allowedDirection === 'PUT' ? 'SHORT' : 'NONE';\n}"
          if 'function macroTrend(rows = ticks)' not in s:
              if tick_marker not in s: raise SystemExit('COMET allowedSide marker missing')
              s = s.replace(tick_marker, macro + "\n" + tick_marker, 1)

          old = """function candidate(m) {
  if (!auto || position || !m?.ready) return null;
  if (!['UP', 'DOWN'].includes(m.direction)) return null;
  const direction = m.direction === 'UP' ? 'CALL' : 'PUT';
  const permission = mountainAllows(m, direction);
  if (!permission.allowed || !cometEntryAllowed(m)) return null;
"""
          new = """function candidate(m) {
  if (!auto || position || !m?.ready) return null;
  if (!['UP', 'DOWN'].includes(m.direction)) return null;
  const macro = macroTrend(ticks);
  if (!['UP', 'DOWN'].includes(macro.direction)) return null;
  if (macro.direction !== m.direction) return null;
  const direction = m.direction === 'UP' ? 'CALL' : 'PUT';
  const permission = mountainAllows(m, direction);
  if (!permission.allowed || !cometEntryAllowed(m)) return null;
"""
          if old not in s: raise SystemExit('COMET candidate marker missing')
          s = s.replace(old, new, 1)

          old = """    openedAt: Date.now(), openedEpoch: epoch, entryKey: key, bestR: 0, reversalVotes: 0,
    entryContext: slimMountain(m), plannedRiskDistance: riskDistance
"""
          new = """    openedAt: Date.now(), openedEpoch: epoch, entryKey: key, bestR: 0, reversalVotes: 0,
    entryContext: slimMountain(m), macroContext: macro, plannedRiskDistance: riskDistance
"""
          if old not in s: raise SystemExit('COMET entry context marker missing')
          s = s.replace(old, new, 1)

          old = "addTape('ENTRY', `${c.side} @ ${c.entry.toFixed(2)} · ${c.entryContext.entryMode} · stop ${c.stop.toFixed(2)} · target ${c.target.toFixed(2)}`, { side: c.side });"
          new = "addTape('ENTRY', `${c.side} @ ${c.entry.toFixed(2)} · BIG ${c.macroContext?.direction || '?'} ${c.macroContext?.strength || 0}/100 · ${c.entryContext.entryMode} · stop ${c.stop.toFixed(2)} · target ${c.target.toFixed(2)}`, { side: c.side });"
          if old not in s: raise SystemExit('COMET entry tape marker missing')
          s = s.replace(old, new, 1)

          old = """  const opposite = (position.side === 'LONG' && m.direction === 'DOWN') || (position.side === 'SHORT' && m.direction === 'UP');
  position.reversalVotes = opposite ? Number(position.reversalVotes || 0) + 1 : 0;
  if (position.reversalVotes >= cometReversalVotesNeeded()) return closePaperPosition('CONFIRMED MOUNTAIN REVERSAL', q);
"""
          new = """  const macro = macroTrend(ticks);
  const opposite = (position.side === 'LONG' && m.direction === 'DOWN') || (position.side === 'SHORT' && m.direction === 'UP');
  const macroOpposite = (position.side === 'LONG' && macro.direction === 'DOWN') || (position.side === 'SHORT' && macro.direction === 'UP');
  // A local opposite mountain is a pullback while the macro trend still supports the position.
  // Only promote it to a thesis-reversal exit when the macro trend has flipped too.
  position.reversalVotes = opposite && macroOpposite ? Number(position.reversalVotes || 0) + 1 : 0;
  if (position.reversalVotes >= cometReversalVotesNeeded()) return closePaperPosition('CONFIRMED MACRO + MOUNTAIN REVERSAL', q);
"""
          if old not in s: raise SystemExit('COMET reversal marker missing')
          s = s.replace(old, new, 1)

          old = "$('mapPermission').textContent = `${allowedSide(latestMountain)} ONLY`;"
          new = "$('mapPermission').textContent = `${allowedSide(latestMountain)} LOCAL · BIG ${macroTrend(ticks).direction}`;"
          if old not in s: raise SystemExit('COMET map permission marker missing')
          s = s.replace(old, new, 1)

          old = "window.COMET_RUNTIME = { getSession: () => structuredClone(session), getTuning: () => structuredClone(tuning), getTicks: () => structuredClone(ticks), getMountain: () => structuredClone(latestMountain), getDemoExecution: () => demoExecutor?.snapshot(), exportCsv, drawChart, saveMapPng };"
          new = "window.COMET_RUNTIME = { getSession: () => structuredClone(session), getTuning: () => structuredClone(tuning), getTicks: () => structuredClone(ticks), getMountain: () => structuredClone(latestMountain), getMacroTrend: () => structuredClone(macroTrend(ticks)), getDemoExecution: () => demoExecutor?.snapshot(), exportCsv, drawChart, saveMapPng };"
          if old not in s: raise SystemExit('COMET runtime marker missing')
          s = s.replace(old, new, 1)
          path.write_text(s)

          # LAST MAN STANDING
          path = Path('public/last-man-standing.js')
          s = path.read_text()
          tick_marker = "function allowedSide(m) { return m?.allowedDirection === 'CALL' ? 'LONG' : m?.allowedDirection === 'PUT' ? 'SHORT' : 'NONE'; }"
          if 'function macroTrend(rows = ticks)' not in s:
              if tick_marker not in s: raise SystemExit('LMS allowedSide marker missing')
              s = s.replace(tick_marker, macro + "\n" + tick_marker, 1)

          old = """function candidate(m) {
  if (!auto || position || !m?.ready || !['UP', 'DOWN'].includes(m.direction)) return null;
  const direction = m.direction === 'UP' ? 'CALL' : 'PUT';
  const permission = mountainAllows(m, direction);
  if (!permission.allowed || !lmsEntryAllowed(m)) return null;
"""
          new = """function candidate(m) {
  if (!auto || position || !m?.ready || !['UP', 'DOWN'].includes(m.direction)) return null;
  const macro = macroTrend(ticks);
  if (!['UP', 'DOWN'].includes(macro.direction)) return null;
  if (macro.direction !== m.direction) return null;
  const direction = m.direction === 'UP' ? 'CALL' : 'PUT';
  const permission = mountainAllows(m, direction);
  if (!permission.allowed || !lmsEntryAllowed(m)) return null;
"""
          if old not in s: raise SystemExit('LMS candidate marker missing')
          s = s.replace(old, new, 1)

          old = """    entryKey: key, bestR: 0, lockedR: -1, reversalVotes: 0, targetExtended: false, entryContext: slimMountain(m), plannedRiskDistance: riskDistance
"""
          new = """    entryKey: key, bestR: 0, lockedR: -1, reversalVotes: 0, targetExtended: false, entryContext: slimMountain(m), macroContext: macro, plannedRiskDistance: riskDistance
"""
          if old not in s: raise SystemExit('LMS entry context marker missing')
          s = s.replace(old, new, 1)

          old = "addTape('ENTRY', `${c.mode} ${c.side} @ ${c.entry.toFixed(2)} · power ${c.entryPower}/100 · stake ${money(c.stakeDollars)} · SL ${money(c.riskDollars)} · target ${c.targetR.toFixed(2)}R`, { side: c.side, mode: c.mode });"
          new = "addTape('ENTRY', `${c.mode} ${c.side} @ ${c.entry.toFixed(2)} · BIG ${c.macroContext?.direction || '?'} ${c.macroContext?.strength || 0}/100 · power ${c.entryPower}/100 · stake ${money(c.stakeDollars)} · SL ${money(c.riskDollars)} · target ${c.targetR.toFixed(2)}R`, { side: c.side, mode: c.mode });"
          if old not in s: raise SystemExit('LMS entry tape marker missing')
          s = s.replace(old, new, 1)

          old = """  const opposite = (p.side === 'LONG' && m.direction === 'DOWN') || (p.side === 'SHORT' && m.direction === 'UP');
  p.reversalVotes = opposite ? Number(p.reversalVotes || 0) + 1 : 0;
  if (p.reversalVotes >= lmsReversalVotesNeeded()) return closePaperPosition('CONFIRMED MOUNTAIN REVERSAL', q);
"""
          new = """  const macro = macroTrend(ticks);
  const opposite = (p.side === 'LONG' && m.direction === 'DOWN') || (p.side === 'SHORT' && m.direction === 'UP');
  const macroOpposite = (p.side === 'LONG' && macro.direction === 'DOWN') || (p.side === 'SHORT' && macro.direction === 'UP');
  // Local counter-mountains are treated as pullbacks. A reversal exit needs the macro trend to flip too.
  p.reversalVotes = opposite && macroOpposite ? Number(p.reversalVotes || 0) + 1 : 0;
  if (p.reversalVotes >= lmsReversalVotesNeeded()) return closePaperPosition('CONFIRMED MACRO + MOUNTAIN REVERSAL', q);
"""
          if old not in s: raise SystemExit('LMS reversal marker missing')
          s = s.replace(old, new, 1)

          old = "$('trendMountain').textContent = latestMountain.direction || 'WARMING'; $('trendPermission').textContent = `${allowedSide(latestMountain)} ONLY`;"
          new = "$('trendMountain').textContent = latestMountain.direction || 'WARMING'; $('trendPermission').textContent = `${allowedSide(latestMountain)} LOCAL · BIG ${macroTrend(ticks).direction}`;"
          if old not in s: raise SystemExit('LMS trend permission marker missing')
          s = s.replace(old, new, 1)

          old = "window.LAST_MAN_STANDING={getSession:()=>structuredClone(session),getTuning:()=>structuredClone(tuning),getTicks:()=>structuredClone(ticks),getMountain:()=>structuredClone(latestMountain),getTrendPower:()=>latestPower,getDemoExecution:()=>demoExecutor?.snapshot(),exportCsv};"
          new = "window.LAST_MAN_STANDING={getSession:()=>structuredClone(session),getTuning:()=>structuredClone(tuning),getTicks:()=>structuredClone(ticks),getMountain:()=>structuredClone(latestMountain),getMacroTrend:()=>structuredClone(macroTrend(ticks)),getTrendPower:()=>latestPower,getDemoExecution:()=>demoExecutor?.snapshot(),exportCsv};"
          if old not in s: raise SystemExit('LMS runtime marker missing')
          s = s.replace(old, new, 1)
          path.write_text(s)
          PY

          node --check public/comet.js
          node --check public/last-man-standing.js
          grep -n "macroTrend\|MACRO + MOUNTAIN\|BIG .*LOCAL" public/comet.js public/last-man-standing.js | head -40

      - name: Commit macro trend fix
        shell: bash
        run: |
          git config user.name "SANI Trend Fix"
          git config user.email "actions@users.noreply.github.com"
          git add public/comet.js public/last-man-standing.js
          git commit -m "fix: make macro trend the boss for Comet and LMS [macro-trend-fixed]"
          git push origin HEAD:codex/comet-lms-demo-multipliers
