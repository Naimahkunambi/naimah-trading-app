name: Build NAI Runner V2 Long

on:
  workflow_dispatch:
  push:
    branches:
      - codex/nana-from-scratch
    paths:
      - 'ctrader/NaiAutopilot/**'
      - '.github/workflows/build-nai-autopilot.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore ctrader/NaiAutopilot/NaiAutopilot.csproj

      - name: Build cTrader algo
        run: dotnet build ctrader/NaiAutopilot/NaiAutopilot.csproj --configuration Release -p:IncludeSource=True

      - name: Locate algo package
        shell: bash
        run: |
          set -euxo pipefail
          find ctrader/NaiAutopilot -type f -name '*.algo' -print
          ALGO="$(find ctrader/NaiAutopilot -type f -name '*.algo' | head -n 1)"
          test -n "$ALGO"
          cp "$ALGO" NAI-Runner-V2-Long.algo

      - name: Upload installable cBot
        uses: actions/upload-artifact@v4
        with:
          name: NAI-Runner-V2-Long
          path: NAI-Runner-V2-Long.algo
          if-no-files-found: error
